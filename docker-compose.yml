services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: preplab
      POSTGRES_PASSWORD: preplab
      POSTGRES_DB: asvab
    ports:
      - "5432:5432"
    volumes:
      - preplab_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preplab -d asvab"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  preplab_pg:
